{% extends "base.html" %}

{% block title %}404 - Territory Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 5rem auto; padding: 0 1.5rem; text-align: center;">
  <div style="font-size: 5rem; margin-bottom: 1rem;">🧭</div>
  <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">404 - Uncharted Territory</h1>
  <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
    The country, ocean, or coordinate you were navigating towards does not exist in our geographic registry.
  </p>
  <a href="{{ url_for('main.index') }}" class="tn-btn tn-btn-primary">Return to World Map</a>
</div>
{% endblock %}
